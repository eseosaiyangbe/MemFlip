name: Publish Docker Hub Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/publish-dockerhub-images.yml"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Docker Hub images
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure Docker Hub credentials exist
        run: |
          set -euo pipefail
          [ -n "${DOCKERHUB_USERNAME:-}" ] || { echo "DOCKERHUB_USERNAME secret is required"; exit 1; }
          [ -n "${DOCKERHUB_TOKEN:-}" ] || { echo "DOCKERHUB_TOKEN secret is required"; exit 1; }

      - name: Resolve immutable tag
        id: meta
        run: |
          set -euo pipefail
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-home-lab-2025-backend:${{ steps.meta.outputs.short_sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-home-lab-2025-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-home-lab-2025-frontend:${{ steps.meta.outputs.short_sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-home-lab-2025-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize Docker Hub release
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Docker Hub image release

          - validation is handled separately by `.github/workflows/validate.yml`
          - this workflow publishes backend and frontend images to Docker Hub
          - immutable tags use the Git short SHA
          - production promotion is handled separately from image publishing
          EOF
