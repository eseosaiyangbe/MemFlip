name: Publish AWS ECR Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-aws-ecr.yml"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_NAME_BACKEND: devops-home-lab-backend
  IMAGE_NAME_FRONTEND: devops-home-lab-frontend

jobs:
  publish:
    name: Publish ECR images
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        run: |
          set -euo pipefail
          echo "registry=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME_BACKEND }}:${{ steps.ecr.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.ecr.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME_BACKEND }}:${{ steps.ecr.outputs.tag }}
          format: sarif
          output: trivy-backend.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-backend.sarif

      - name: Summarize ECR release
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## AWS ECR image release

          - validation is handled separately by `.github/workflows/validate.yml`
          - this workflow publishes immutable ECR images only
          - GitOps promotion is handled separately by `.github/workflows/promote-aws-gitops.yml`
          EOF
