apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memflip-backup-storage
  labels:
    app.kubernetes.io/name: memflip-state-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: internal-developer-platform
    observability.dev/app: memflip
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memflip-state-backup
  labels:
    app.kubernetes.io/name: memflip-state-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: internal-developer-platform
    observability.dev/app: memflip
spec:
  schedule: "0 5 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: memflip-state-backup
            backup-role: state-backup
        spec:
          restartPolicy: Never
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: memflip-backup-storage
            - name: backup-meta
              emptyDir: {}
          initContainers:
            - name: prepare-timestamp
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - date -u +%Y%m%dT%H%M%SZ > /meta/timestamp
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              volumeMounts:
                - name: backup-meta
                  mountPath: /meta
          containers:
            - name: postgres-backup
              image: postgres:15-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: memflip-postgres
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: memflip-app-config
                      key: DB_PORT
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: memflip-app-config
                      key: DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: memflip-app-secrets
                      key: DB_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: memflip-app-config
                      key: DB_NAME
                - name: KEEP_BACKUPS
                  value: "7"
              command:
                - sh
                - -ec
                - |
                  ts="$(cat /meta/timestamp)"
                  target="/backup/memflip-postgres-${ts}.dump"
                  tmp="${target}.tmp"

                  echo "Waiting for PostgreSQL at ${PGHOST}:${PGPORT}"
                  for _ in $(seq 1 60); do
                    if pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done

                  echo "Starting PostgreSQL backup to ${target}"
                  pg_dump \
                    --host="${PGHOST}" \
                    --port="${PGPORT}" \
                    --username="${PGUSER}" \
                    --dbname="${PGDATABASE}" \
                    --format=custom \
                    --no-owner \
                    --no-privileges \
                    --file="${tmp}"

                  [ -s "${tmp}" ]
                  mv "${tmp}" "${target}"

                  keep="${KEEP_BACKUPS:-7}"
                  if [ "${keep}" -gt 0 ] 2>/dev/null; then
                    ls -1t /backup/memflip-postgres-*.dump 2>/dev/null | tail -n +"$((keep + 1))" | xargs -r rm -f
                  fi

                  ls -lh /backup/memflip-postgres-*.dump 2>/dev/null || true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 150m
                  memory: 256Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                - name: backup-meta
                  mountPath: /meta
            - name: redis-backup
              image: redis:7.2-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: REDIS_HOST
                  value: memflip-redis
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: memflip-app-secrets
                      key: REDIS_PASSWORD
                - name: KEEP_BACKUPS
                  value: "7"
              command:
                - sh
                - -ec
                - |
                  ts="$(cat /meta/timestamp)"
                  target="/backup/memflip-redis-${ts}.rdb"
                  tmp="${target}.tmp"

                  echo "Waiting for Redis at ${REDIS_HOST}:6379"
                  for _ in $(seq 1 60); do
                    if REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli -h "${REDIS_HOST}" ping >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done

                  echo "Starting Redis backup to ${target}"
                  redis-cli -h "${REDIS_HOST}" -a "${REDIS_PASSWORD}" --rdb "${tmp}"

                  [ -s "${tmp}" ]
                  mv "${tmp}" "${target}"

                  keep="${KEEP_BACKUPS:-7}"
                  if [ "${keep}" -gt 0 ] 2>/dev/null; then
                    ls -1t /backup/memflip-redis-*.rdb 2>/dev/null | tail -n +"$((keep + 1))" | xargs -r rm -f
                  fi

                  ls -lh /backup/memflip-redis-*.rdb 2>/dev/null || true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                - name: backup-meta
                  mountPath: /meta
